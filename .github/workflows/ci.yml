name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # `raw/` is intentionally not committed. Recreate the pinned sources
      # from data/sources.lock.json before running the import pipeline.
      - run: npm run data:bootstrap
      - run: npm run data:inventory
      - run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --reporter=github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acatalog-ci-artifacts
          path: |
            dist
            output/playwright
          if-no-files-found: warn
